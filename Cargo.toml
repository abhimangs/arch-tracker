[package]
name = "arch-tracker"
version = "0.1.0"
edition = "2024"
description = "Local screen-time and activity tracker for KDE Plasma on Wayland"
license = "MIT"
repository = "https://github.com/abhimangs/arch-tracker"
readme = "README.md"
keywords = ["screen-time", "kde", "wayland", "time-tracking", "productivity"]
categories = ["command-line-utilities"]
exclude = ["docs/screenshots", ".github"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4.6.9", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = "1.0.2"
libc = "0.2.191"
notify = { version = "9.0.0", default-features = false }
regex-lite = "0.1.9"
rusqlite = "0.43.0"
rust-embed = "8.14.0"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "net", "signal", "time", "sync", "io-util", "fs", "process"] }
toml = "1.2.2"
toml_edit = "0.25.20"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter"] }
url = "2.5.9"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "proxy", "service"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
