  <rect x=".3" y=".3" width="31.4" height="31.4" rx="7.2" fill="none" stroke="#2a2a2a" stroke-width=".6"/>
  <g fill="none" stroke-width="4.4">
    <path d="M21.5 9.9A7.5 7.5 0 0 1 23.5 15V27" stroke="#333333"/>
    <path d="M8.5 27V15A7.5 7.5 0 0 1 21.5 9.9" stroke="#ededed"/>
  </g>
  <circle cx="21.5" cy="9.9" r="3.6" fill="#0a0a0a"/>
  <circle cx="21.5" cy="9.9" r="2.5" fill="#e5533d"/>
</svg>
