name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check dashboard and helper scripts
        run: |
          for f in web-ui/app.js scripts/*.mjs; do node --check "$f"; done
          cp gnome/arch-tracker@archtracker.dev/extension.js "$RUNNER_TEMP/gnome-extension.mjs"
          node --check "$RUNNER_TEMP/gnome-extension.mjs"
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Test the browser extension
        run: node scripts/test-extension.mjs
      - name: Lint the Firefox build
        run: scripts/build-extensions.sh && npx --yes web-ext@latest lint --source-dir dist/firefox

  dashboard:
    name: Dashboard smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install SQLite headers and D-Bus tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev dbus libglib2.0-bin
      - name: Build
        run: cargo build --locked
      - name: Open every page on demo data
        run: CHROME="$(command -v google-chrome || command -v chromium)" node scripts/smoke-dashboard.mjs

  desktops:
    name: Window tracking on Sway and GNOME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install compositors, a terminal and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev dbus jq sway foot fonts-dejavu-core \
            gnome-shell dconf-service dconf-gsettings-backend libglib2.0-bin
      - name: Build
        run: cargo build --locked
      - name: Sway
        run: scripts/desktop-smoke.sh sway
      - name: GNOME
        run: scripts/desktop-smoke.sh gnome

  aur:
    name: AUR packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust sqlite hicolor-icon-theme namcap
      - uses: actions/checkout@v7
      - name: Build arch-tracker and arch-tracker-bin from this checkout
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          sudo -u builder bash -c 'git config --global --add safe.directory "$PWD" && scripts/aur-check.sh'

  package:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust sqlite hicolor-icon-theme
      - uses: actions/checkout@v7
      - name: Build with makepkg
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder bash -c 'cd packaging && makepkg --noconfirm --cleanbuild'
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error
