name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check dashboard script
        run: node --check web-ui/app.js

  package:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust sqlite
      - uses: actions/checkout@v7
      - name: Build with makepkg
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder bash -c 'cd packaging && makepkg --noconfirm --cleanbuild'
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error
