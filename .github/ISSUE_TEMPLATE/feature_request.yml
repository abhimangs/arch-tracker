name: Feature request
description: Suggest something arch-tracker should record or show
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to know or do?
      description: Describe the question you want your data to answer, or the task you want to do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could arch-tracker help? Mock-ups and examples welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Browser tracking
        - Terminals and AI agents
        - Idle, watching and calls
        - Other desktops (GNOME, Hyprland, Sway)
        - Packaging
        - Something else
